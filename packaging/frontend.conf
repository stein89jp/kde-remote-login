# Clients connect directly to HOST:33991. Choose a specific host IP to restrict
# the listener, or 127.0.0.1:33991 for SSH tunnelling. IPv6 uses [::]:33991.
# Restrict access to trusted networks using the host firewall.
# PAM broker mode uses TLS-only RDP; NLA-only clients will reject it.
KDE_RDP_LISTEN=0.0.0.0:33991
KDE_RDP_MODE=broker
# KWin output to capture. Unset (default) uses KWin's first output (Virtual-0).
# KDE_RDP_OUTPUT=Virtual-0
# Login screen limits: disconnect after this many seconds without a login
# attempt (10–600, default 60) or on the screen in total (30–1800, default 120).
# The idle limit must not exceed the total. Neither applies after login.
# KDE_RDP_LOGIN_IDLE_SECS=60
# KDE_RDP_LOGIN_TIMEOUT_SECS=120
# Capture/transmission limit, 1–60 FPS. Defaults: 30 bitmap, 60 NVENC.
# KDE_RDP_FPS=60
# NVENC adaptive H.264 bitrate ceiling, 1–100 megabits/sec. Default: 12.
# Each connection reduces bitrate under graphics congestion and recovers slowly.
# KDE_RDP_BITRATE_MBPS=12
# Known total link budget, 3–100 Mbps; reserves 1.7 Mbps for accepted PCM audio.
# KDE_RDP_LINK_MBPS=10
# Measured profiles are opt-in: speed (default), balanced, quality.
# KDE_RDP_VIDEO_PROFILE=speed
# Codec: avc420 (default), auto or avc444, with negotiated fallback.
# KDE_RDP_VIDEO_CODEC=avc420
# Capture: auto (default with NVENC) for supported GPU import and conversion,
# or shm to force CPU readback. Bitmap mode always uses shm.
# KDE_RDP_GPU_CAPTURE=auto
# Periodic NVENC keyframe interval, 1–3600 seconds. Default: 30. Refresh,
# resize, resume and frame drops still force keyframes immediately.
# KDE_RDP_GOP_SECONDS=30
# Optional NVIDIA DRM render node for auto capture; otherwise probe render nodes.
# Requires the NVIDIA service drop-in and readable /sys device metadata.
# KDE_RDP_GPU_DEVICE=/dev/dri/renderD128
# Output scale follows the Plasma display settings; KDE_RDP_SCALE is ignored on KWin.
# Remote playback channels: stereo (default, stereo PCM preferred,
# ~1.4 Mbit/s) or mono (opt-in: offers mono PCM first; 48 kHz mono sounded
# pitched-up and robotic in Windows 10 mstsc, so leave it unset).
# KDE_RDP_AUDIO_CHANNELS=stereo
# Preferred PCM rate: 44100 (default; resampled from 48 kHz capture because
# mstsc played 48 kHz PCM ~9% slow) or 48000 (former 48 kHz-first offer).
# KDE_RDP_AUDIO_RATE=44100
# PCM drift-skip allowance for the Windows audio clock, 0-2000 ppm. Default: 100.
# Raise it (e.g. 300) only if audio delay creeps up during long continuous sound.
# KDE_RDP_AUDIO_DRIFT_PPM=100
# Microphone from mstsc "Record from this computer": auto (default) or off.
# Windows records only while a remote program listens; off offers no channel.
# KDE_RDP_MICROPHONE=auto
# Optional bounded server timings and counters; never logs desktop/clipboard text.
# KDE_RDP_DIAGNOSTICS=1
# Coordinated FPS: lower the frame rate with the video bitrate under congestion.
# Opt-in; the frame window adapts to the connection delay either way.
# KDE_RDP_ADAPTIVE_GRAPHICS=1
